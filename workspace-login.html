<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>{{workspaceTitle}} | UNFALLX</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="{{workspaceTitle}}"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/app.webmanifest"><link rel="stylesheet" href="/assets/portal.css"><link rel="stylesheet" href="/assets/workspace.css"></head><body class="workspace-login"><main class="workspace-login-main" id="main"><a class="workspace-brand" href="/" aria-label="{{workspaceTitle}} öffnen"><img src="/assets/favicon.svg" alt="" width="28" height="32"><strong>UNFALLX</strong></a><div class="workspace-label">{{workspaceTitle}}</div><h1>{{workspaceHeading}}</h1><p class="workspace-intro">{{workspaceCopy}}</p><section class="workspace-card"><div id="auth-root"><form id="login-form"><label>E-Mail-Adresse<input name="email" type="email" required maxlength="254" autocomplete="username" autocapitalize="none" placeholder="name@firma.de"></label><label>Passwort<input name="password" type="password" required maxlength="128" autocomplete="current-password"></label><button class="btn btn-block" type="submit">Anmelden</button></form><p class="workspace-reset"><a href="/passwort">Passwort vergessen oder festlegen</a></p><details class="auth-alternative"><summary>Per E-Mail-Link anmelden</summary><form id="magic-form"><label>E-Mail-Adresse<input name="email" type="email" required maxlength="254" autocomplete="email" autocapitalize="none"></label><button class="portal-button" type="submit">Login-Link anfordern</button></form></details></div><p id="auth-message" role="status" aria-live="polite"></p><noscript>Bitte JavaScript aktivieren, um dich anzumelden.</noscript></section>{{workspaceEnrollment}}<footer class="workspace-legal"><a href="/app-hilfe">Hilfe</a><a href="/portal-datenschutz">Datenschutz</a><a href="/impressum">Impressum</a></footer></main><script src="/assets/auth.js" defer></script></body></html>
